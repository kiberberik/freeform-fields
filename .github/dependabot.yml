version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ['*']
    ignore:
      # typescript-eslint (inside @wordpress/scripts) supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ['*']
    ignore:
      # PHPUnit 12+ needs PHP 8.3+, 13+ needs PHP 8.4; tests run on PHP 8.2 too.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
