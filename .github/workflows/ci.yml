name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: Build and lint JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd
          tools: composer, wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-progress
      - run: composer lint
        if: matrix.php == '8.3'
      # Built scripts are needed for asset registration in tests.
      - run: npm ci && npm run build
      - run: bin/setup-dev.sh
      - run: composer test

  php81:
    name: PHP 8.1 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      # PHPUnit 11 needs PHP 8.2, so on 8.1 (the minimum the plugin supports) only the syntax is checked.
      - run: find freeform-fields.php src examples -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: [js, php, php81]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freeform-fields
          path: dist/*.zip
